name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for crates.io Trusted Publishing (OIDC token exchange).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Installs the nightly channel pinned by rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Re-tagged releases re-run this job after a successful publish; the
      # version is immutable on crates.io, so "already exists" is success.
      # The log lives outside the workspace: a file created in it would
      # fail cargo's dirty-worktree check.
      - name: cargo publish
        run: |
          set -o pipefail
          if cargo publish 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi
          grep -q "already exists on crates.io index" /tmp/publish.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
